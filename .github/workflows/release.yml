name: Create GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: 3. Run Tests
      run: mvn -B test --file pom.xml

    - name: 4. Package Application JAR
      run: mvn -B package -DskipTests --file pom.xml

    - name: 5. Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        tag_name: ${{ github.ref }}
        body: |
          ## 🚀 Release ${{ github.ref_name }}
          
          Artefacto compilado y empaquetado automáticamente por **GitHub Actions**.
          
          ### 📦 Contenido:
          * `app.jar`: Ejecutable Spring Boot versión `${{ github.ref_name }}`.
          * Compatible con despliegue **Blue-Green** en Nginx.
          
          ### 🛠️ Despliegue en VM:
          ```bash
          ./scripts/deploy.sh ${{ github.ref_name }}
          ```
        files: |
          target/app.jar
        draft: false
        prerelease: false
